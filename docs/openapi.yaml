openapi: 3.0.3
info:
  title: API - Media (Text-Based CAPTCHA & User Auth API)
  version: 1.0.0
  description: |
    API RESTful construida con Node.js, Express 5 y MySQL2.
    Incluye motor activo de verificación CAPTCHA cultural basado en escenas HD con subtítulos incrustados,
    catálogo audiovisual protegido contra scraping de respuestas, autenticación basada en JWT,
    autorización RBAC estricta (`cliente`/`admin`, protección de titularidad BOLA) y validación RegEx.
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local

paths:
  /:
    get:
      summary: Healthcheck y mensaje de bienvenida
      description: Endpoint público para comprobar que el servicio está activo.
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bienvenido a la API de Media!

  /usuarios:
    get:
      summary: Listar todos los usuarios
      description: Recupera la lista completa de usuarios registrados. Requiere autenticación.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioRespuesta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Registrar nuevo usuario
      description: |
        Crea una nueva cuenta de usuario con contraseña hasheada (bcrypt, 12 rondas) y validación RegEx.
        El registro público asigna el rol `cliente`. Para crear una cuenta con rol `admin` se debe enviar un Bearer Token de administrador.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoUsuario'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario creado con éxito
                  usuario:
                    $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Intento de asignar rol 'admin' sin privilegios de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
              example:
                message: "Acceso denegado: solo un administrador autenticado puede asignar el rol 'admin'"
        '409':
          description: Conflicto - El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
              example:
                message: El correo ya se encuentra registrado

  /usuarios/login:
    post:
      summary: Iniciar sesión
      description: Valida credenciales de usuario y retorna un token JWT válido por 2 horas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - correo
                - contrasena
              properties:
                correo:
                  type: string
                  format: email
                  example: carlos.gomez@ejemplo.com
                contrasena:
                  type: string
                  format: password
                  example: ClaveSegura123
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Inicio de sesión exitoso
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  usuario:
                    $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
              example:
                message: Credenciales inválidas

  /usuarios/perfil:
    get:
      summary: Obtener perfil del usuario autenticado
      description: Retorna la identidad y datos del usuario extraídos a partir de su token JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRespuesta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /usuarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador numérico único del usuario
        schema:
          type: integer
          example: 2

    get:
      summary: Obtener usuario por ID
      description: Retorna la información de un usuario específico.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Actualizar datos de un usuario
      description: |
        Modifica nombre, apellido o correo de un usuario existente.
        Solo permitido para el propio titular de la cuenta (`:id`) o para un usuario con rol `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: Carlos Actualizado
                apellido:
                  type: string
                  example: Gomez Perez
                correo:
                  type: string
                  format: email
                  example: carlos.nuevo@ejemplo.com
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario actualizado correctamente
                  usuario:
                    $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: El nuevo correo ya está en uso por otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'

    delete:
      summary: Eliminar usuario por ID
      description: Exclusivo para administradores (rol 'admin'). Elimina el registro del usuario.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario eliminado correctamente
                  usuario:
                    $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Acceso denegado - Requiere rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
              example:
                message: "Acceso denegado: se requieren privilegios de administrador"
        '404':
          $ref: '#/components/responses/NotFoundError'

  /captcha/nuevo:
    get:
      summary: Generar nuevo desafío CAPTCHA
      description: Selecciona una escena aleatoria activa y emite un token efímero (10 min) con URL de imagen HD sin exponer el subtítulo.
      parameters:
        - name: dificultad
          in: query
          required: false
          description: Nivel de dificultad de la escena
          schema:
            type: string
            enum: [facil, medio, dificil]
      responses:
        '201':
          description: Desafío generado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Desafío CAPTCHA generado con éxito
                  desafio_id:
                    type: string
                    format: uuid
                  token:
                    type: string
                    example: tok_9f8a7b6c5d4e3f2a1b0c...
                  imagen_url:
                    type: string
                    format: uri
                    example: http://localhost:3000/imagenes/matrix_pastilla_azul_roja.jpg
                  dificultad:
                    type: string
                    example: medio
                  obra:
                    type: string
                    example: The Matrix
                  expira_en:
                    type: string
                    format: date-time
                  instrucciones:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /captcha/validar:
    post:
      summary: Validar desafío CAPTCHA
      description: Compara la transcripción enviada por el usuario con el subtítulo esperado aplicando normalización y distancia de Levenshtein (>= 85%).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - respuesta
              properties:
                token:
                  type: string
                  example: tok_9f8a7b6c5d4e3f2a1b0c...
                respuesta:
                  type: string
                  example: Toma la pastilla azul y el fin de la historia. Toma la pastilla roja y te quedas en el País de las Maravillas.
      responses:
        '200':
          description: Verificación humana exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  valido:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Verificación humana exitosa
                  desafio_id:
                    type: string
                  token:
                    type: string
        '400':
          description: Respuesta incorrecta, desafío expirado o ya resuelto
          content:
            application/json:
              schema:
                type: object
                properties:
                  valido:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: La respuesta no coincide con el subtítulo de la escena. Intente nuevamente.
        '404':
          description: Desafío no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'

  /escenas:
    get:
      summary: Listar escenas audiovisuales
      description: |
        Retorna el catálogo de escenas con metadatos de actores, personajes y obras.
        Por seguridad anti-scraping del CAPTCHA, el campo `subtitulo_texto` se omite en consultas públicas y solo se incluye si se autentica un usuario con rol `admin`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: obra_id
          in: query
          required: false
          schema:
            type: integer
        - name: dificultad
          in: query
          required: false
          schema:
            type: string
            enum: [facil, medio, dificil]
      responses:
        '200':
          description: Catálogo de escenas obtenido
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscenaRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /escenas/{id}:
    get:
      summary: Obtener escena por ID
      description: Retorna el detalle de una escena específica (`subtitulo_texto` visible únicamente para rol `admin`).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de escena
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscenaRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /obras:
    get:
      summary: Listar obras audiovisuales
      description: Retorna las películas, series y anime catalogados con la cantidad de escenas disponibles.
      responses:
        '200':
          description: Catálogo de producciones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    titulo:
                      type: string
                    tipo:
                      type: string
                    anio_estreno:
                      type: integer
                    total_escenas:
                      type: integer

  /obras/{id}:
    get:
      summary: Obtener obra por ID con sus escenas
      description: Retorna los datos de la obra junto a su arreglo de escenas activas (`subtitulo_texto` incluido solo para rol `admin`).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Obra con escenas asociadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  titulo:
                    type: string
                  tipo:
                    type: string
                  anio_estreno:
                    type: integer
                  escenas:
                    type: array
                    items:
                      $ref: '#/components/schemas/EscenaRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NuevoUsuario:
      type: object
      required:
        - nombre
        - correo
        - contrasena
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 50
          example: Carlos
        apellido:
          type: string
          minLength: 2
          maxLength: 50
          example: Gomez
        correo:
          type: string
          format: email
          example: carlos.gomez@ejemplo.com
        contrasena:
          type: string
          format: password
          description: Mínimo 8 caracteres, al menos una mayúscula, una minúscula y un número
          example: ClaveSegura123
        rol:
          type: string
          enum: [cliente, admin]
          default: cliente
          description: El valor 'admin' requiere enviar Authorization Bearer token de administrador
          example: cliente

    UsuarioRespuesta:
      type: object
      properties:
        id:
          type: integer
          example: 2
        nombre:
          type: string
          example: Carlos
        apellido:
          type: string
          example: Gomez
        correo:
          type: string
          example: carlos.gomez@ejemplo.com
        rol:
          type: string
          example: cliente
        creado_en:
          type: string
          format: date-time
          example: '2026-10-20T22:30:00.000Z'

    EscenaRespuesta:
      type: object
      properties:
        id:
          type: integer
          example: 1
        imagen_de_escena:
          type: string
          example: matrix_pastilla_azul_roja.jpg
        imagen_url:
          type: string
          format: uri
          example: http://localhost:3000/imagenes/matrix_pastilla_azul_roja.jpg
        subtitulo_texto:
          type: string
          description: Solo presente cuando consulta un usuario autenticado con rol 'admin'
          example: Toma la pastilla azul y el fin de la historia. Toma la pastilla roja y te quedas en el País de las Maravillas.
        minuto_escena:
          type: number
          example: 28.45
        dificultad:
          type: string
          example: medio
        obra_titulo:
          type: string
          example: The Matrix
        actor_nombre:
          type: string
          example: Laurence Fishburne
        personaje_nombre:
          type: string
          example: Morpheus

    MensajeError:
      type: object
      properties:
        message:
          type: string
          example: Descripción detallada del error

  responses:
    BadRequestError:
      description: Solicitud incorrecta o falló la validación RegEx / parámetros
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MensajeError'
    UnauthorizedError:
      description: Token ausente, con formato inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MensajeError'
    ForbiddenError:
      description: Token inválido, adulterado o permisos insuficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MensajeError'
    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MensajeError'
          example:
            message: Recurso no encontrado
