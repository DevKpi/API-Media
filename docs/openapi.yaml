openapi: 3.0.3
info:
  title: API - Media (Text-Based CAPTCHA & User Auth API)
  version: 1.0.0
  description: |
    API RESTful construida con Node.js, Express y MySQL2. 
    Incluye sistema completo de registro, autenticación basada en JWT, autorización RBAC (cliente/admin) y validación RegEx.
    Base de datos relacional preparada para motor de verificación CAPTCHA cultural de escenas y subtítulos.
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local

paths:
  /:
    get:
      summary: Healthcheck y mensaje de bienvenida
      description: Endpoint público para comprobar que el servicio está activo.
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bienvenido a la API de Media!

  /usuarios:
    get:
      summary: Listar todos los usuarios
      description: Recupera la lista completa de usuarios registrados. Requiere autenticación.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioRespuesta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Registrar nuevo usuario
      description: Crea una nueva cuenta de usuario con contraseña hasheada (bcrypt) y validación RegEx.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoUsuario'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario creado con éxito
                  usuario:
                    $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Conflicto - El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
                example:
                  message: El correo ya se encuentra registrado

  /usuarios/login:
    post:
      summary: Iniciar sesión
      description: Valida credenciales de usuario y retorna un token JWT válido por 2 horas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - correo
                - contrasena
              properties:
                correo:
                  type: string
                  format: email
                  example: carlos.gomez@ejemplo.com
                contrasena:
                  type: string
                  format: password
                  example: ClaveSegura123
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Inicio de sesión exitoso
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  usuario:
                    $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
                example:
                  message: Credenciales inválidas

  /usuarios/perfil:
    get:
      summary: Obtener perfil del usuario autenticado
      description: Retorna la identidad y datos del usuario extraídos a partir de su token JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRespuesta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /usuarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador numérico único del usuario
        schema:
          type: integer
          example: 2

    get:
      summary: Obtener usuario por ID
      description: Retorna la información de un usuario específico.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Actualizar datos de un usuario
      description: Modifica nombre, apellido o correo de un usuario existente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: Carlos Actualizado
                apellido:
                  type: string
                  example: Gomez Perez
                correo:
                  type: string
                  format: email
                  example: carlos.nuevo@ejemplo.com
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario actualizado correctamente
                  usuario:
                    $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: El nuevo correo ya está en uso por otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'

    delete:
      summary: Eliminar usuario por ID
      description: Exclusivo para administradores (rol 'admin'). Elimina el registro del usuario.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario eliminado correctamente
                  usuario:
                    $ref: '#/components/schemas/UsuarioRespuesta'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Acceso denegado - Requiere rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
                example:
                  message: Acceso denegado: se requieren privilegios de administrador
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NuevoUsuario:
      type: object
      required:
        - nombre
        - correo
        - contrasena
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 50
          example: Carlos
        apellido:
          type: string
          minLength: 2
          maxLength: 50
          example: Gomez
        correo:
          type: string
          format: email
          example: carlos.gomez@ejemplo.com
        contrasena:
          type: string
          format: password
          description: Mínimo 8 caracteres, al menos una mayúscula, una minúscula y un número
          example: ClaveSegura123
        rol:
          type: string
          enum: [cliente, admin]
          default: cliente
          example: cliente

    UsuarioRespuesta:
      type: object
      properties:
        id:
          type: integer
          example: 2
        nombre:
          type: string
          example: Carlos
        apellido:
          type: string
          example: Gomez
        correo:
          type: string
          example: carlos.gomez@ejemplo.com
        rol:
          type: string
          example: cliente
        creado_en:
          type: string
          format: date-time
          example: '2026-10-20T22:30:00.000Z'

    MensajeError:
      type: object
      properties:
        message:
          type: string
          example: Descripción detallada del error

  responses:
    BadRequestError:
      description: Solicitud incorrecta o falló la validación RegEx
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MensajeError'
    UnauthorizedError:
      description: Token ausente, con formato inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MensajeError'
    ForbiddenError:
      description: Token inválido, adulterado o permisos insuficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MensajeError'
    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MensajeError'
            example:
              message: Usuario no encontrado
